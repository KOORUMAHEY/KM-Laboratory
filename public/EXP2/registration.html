<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kooru Bookstore - Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>

<body class="bg-gray-100">
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-2">
        <span class="text-3xl">📚</span>
        <span class="text-2xl font-bold text-purple-700">Kooru Bookstore</span>
      </a>
      <nav class="hidden md:flex space-x-6">
        <a href="index.html" class="hover:text-purple-700">Home</a>
        <a href="catalogue.html" class="hover:text-purple-700">Catalogue</a>
        <a href="cart.html" class="relative hover:text-purple-700">
          Cart
          <span class="absolute -top-2 -right-4 bg-purple-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </a>
        <a href="login.html" class="hover:text-purple-700">Login</a>
        <a href="registration.html" class="bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">Register</a>
      </nav>
      <button id="mobile-menu-button" class="md:hidden text-gray-600 hover:text-purple-700">
        ☰
      </button>
    </div>
    <div id="mobile-menu" class="md:hidden hidden px-4 pb-4 space-y-2">
      <a href="index.html" class="block hover:text-purple-700">Home</a>
      <a href="catalogue.html" class="block hover:text-purple-700">Catalogue</a>
      <a href="cart.html" class="block hover:text-purple-700">Cart</a>
      <a href="login.html" class="block hover:text-purple-700">Login</a>
      <a href="registration.html" class="block bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">Register</a>
    </div>
  </header>

  <main class="max-w-lg mx-auto mt-12 bg-white p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold text-purple-700 mb-6 text-center">Create Your Account</h2>
    
    <form id="registrationForm" class="space-y-5">
      <!-- Full Name -->
      <div>
        <label for="fullName" class="block mb-2 font-medium text-gray-700">Full Name *</label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" 
          placeholder="Enter your full name"
        />
      </div>

      <!-- Email -->
      <div>
        <label for="email" class="block mb-2 font-medium text-gray-700">Email Address *</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" 
          placeholder="Enter your email address"
        />
      </div>

      <!-- Phone -->
      <div>
        <label for="phone" class="block mb-2 font-medium text-gray-700">Phone Number *</label>
        <input 
          type="tel" 
          id="phone" 
          name="phone" 
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" 
          placeholder="Enter your phone number"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block mb-2 font-medium text-gray-700">Password *</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          required
          minlength="8"
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" 
          placeholder="Enter your password"
        />
        <p class="text-sm text-gray-600 mt-1">Password must be at least 8 characters long</p>
      </div>

      <!-- Confirm Password -->
      <div>
        <label for="confirmPassword" class="block mb-2 font-medium text-gray-700">Confirm Password *</label>
        <input 
          type="password" 
          id="confirmPassword" 
          name="confirmPassword" 
          required
          class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all" 
          placeholder="Confirm your password"
        />
        <div id="passwordError" class="text-red-500 text-sm mt-1 hidden">Passwords do not match</div>
      </div>

      <!-- Terms and Conditions -->
      <div class="flex items-start space-x-3">
        <input 
          type="checkbox" 
          id="terms" 
          name="terms" 
          required
          class="mt-1 h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded"
        />
        <label for="terms" class="text-sm text-gray-700 leading-relaxed">
          I agree to the <a href="#" class="text-purple-700 hover:text-purple-800 underline">Terms and Conditions</a> 
          and <a href="#" class="text-purple-700 hover:text-purple-800 underline">Privacy Policy</a> *
        </label>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full bg-purple-700 text-white py-3 rounded-lg font-semibold hover:bg-purple-800 focus:outline-none focus:ring-4 focus:ring-purple-300 transition-all transform hover:scale-[1.02] active:scale-[0.98]"
      >
        Create Account
      </button>
    </form>

    <!-- Login Link -->
    <div class="mt-6 text-center">
      <p class="text-gray-600">Already have an account? 
        <a href="login.html" class="text-purple-700 hover:text-purple-800 font-semibold">Sign in here</a>
      </p>
    </div>
  </main>

  <script>
    // Mobile menu toggle
    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');

    mobileMenuButton.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });

    // Form validation class
    class FormValidator {
      constructor() {
        this.form = document.getElementById('registrationForm');
        this.fields = {
          fullName: document.getElementById('fullName'),
          email: document.getElementById('email'),
          phone: document.getElementById('phone'),
          password: document.getElementById('password'),
          confirmPassword: document.getElementById('confirmPassword'),
          terms: document.getElementById('terms')
        };
        this.errors = {};
        this.init();
      }

      init() {
        // Add error divs for each field
        this.createErrorElements();
        
        // Add real-time validation listeners
        Object.keys(this.fields).forEach(fieldName => {
          if (fieldName !== 'terms') {
            this.fields[fieldName].addEventListener('blur', () => {
              this.validateField(fieldName);
            });
            
            this.fields[fieldName].addEventListener('input', () => {
              // Live validation - validate as user types
              this.validateFieldLive(fieldName);
            });
          }
        });

        // Terms checkbox listener
        this.fields.terms.addEventListener('change', () => {
          this.validateField('terms');
        });

        // Form submission
        this.form.addEventListener('submit', (e) => {
          e.preventDefault();
          this.validateForm();
        });
      }

      createErrorElements() {
        Object.keys(this.fields).forEach(fieldName => {
          if (fieldName !== 'confirmPassword') { // confirmPassword already has error div
            const errorDiv = document.createElement('div');
            errorDiv.id = `${fieldName}Error`;
            errorDiv.className = 'text-red-500 text-sm mt-1 hidden';
            
            if (fieldName === 'terms') {
              this.fields[fieldName].parentElement.parentElement.appendChild(errorDiv);
            } else {
              this.fields[fieldName].parentElement.appendChild(errorDiv);
            }
          }
        });
      }

      validateField(fieldName) {
        const field = this.fields[fieldName];
        let isValid = true;
        let errorMessage = '';

        switch (fieldName) {
          case 'fullName':
            if (!field.value.trim()) {
              errorMessage = 'Full name is required';
              isValid = false;
            } else if (field.value.trim().length < 2) {
              errorMessage = 'Full name must be at least 2 characters long';
              isValid = false;
            } else if (!/^[a-zA-Z\s'-]+$/.test(field.value.trim())) {
              errorMessage = 'Full name can only contain letters, spaces, hyphens, and apostrophes';
              isValid = false;
            }
            break;

          case 'email':
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!field.value.trim()) {
              errorMessage = 'Email address is required';
              isValid = false;
            } else if (!emailRegex.test(field.value.trim())) {
              errorMessage = 'Please enter a valid email address';
              isValid = false;
            }
            break;

          case 'phone':
            const phoneRegex = /^[\+]?[1-9][\d]{0,15}$/;
            const cleanPhone = field.value.replace(/[\s\-\(\)]/g, '');
            if (!field.value.trim()) {
              errorMessage = 'Phone number is required';
              isValid = false;
            } else if (cleanPhone.length < 10) {
              errorMessage = 'Phone number must be at least 10 digits';
              isValid = false;
            } else if (!phoneRegex.test(cleanPhone)) {
              errorMessage = 'Please enter a valid phone number';
              isValid = false;
            }
            break;

          case 'password':
            const password = field.value;
            if (!password) {
              errorMessage = 'Password is required';
              isValid = false;
            } else {
              const validationResult = this.validatePasswordStrength(password);
              if (!validationResult.isValid) {
                errorMessage = validationResult.message;
                isValid = false;
              }
            }
            break;

          case 'confirmPassword':
            if (!field.value) {
              errorMessage = 'Please confirm your password';
              isValid = false;
            } else if (field.value !== this.fields.password.value) {
              errorMessage = 'Passwords do not match';
              isValid = false;
            }
            break;

          case 'terms':
            if (!field.checked) {
              errorMessage = 'You must agree to the Terms and Conditions';
              isValid = false;
            }
            break;
        }

        this.displayFieldError(fieldName, errorMessage, !isValid);
        return isValid;
      }

      validatePasswordStrength(password) {
        const minLength = 8;
        const hasUpperCase = /[A-Z]/.test(password);
        const hasLowerCase = /[a-z]/.test(password);
        const hasNumbers = /\d/.test(password);
        const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

        if (password.length < minLength) {
          return {
            isValid: false,
            message: `Password must be at least ${minLength} characters long`
          };
        }

        if (!hasUpperCase) {
          return {
            isValid: false,
            message: 'Password must contain at least one uppercase letter'
          };
        }

        if (!hasLowerCase) {
          return {
            isValid: false,
            message: 'Password must contain at least one lowercase letter'
          };
        }

        if (!hasNumbers) {
          return {
            isValid: false,
            message: 'Password must contain at least one number'
          };
        }

        if (!hasSpecialChar) {
          return {
            isValid: false,
            message: 'Password must contain at least one special character (!@#$%^&*(),.?":{}|<>)'
          };
        }

        return { isValid: true, message: '' };
      }

      displayFieldError(fieldName, message, hasError) {
        const field = this.fields[fieldName];
        const errorDiv = document.getElementById(`${fieldName}Error`);

        if (hasError) {
          errorDiv.textContent = message;
          errorDiv.classList.remove('hidden');
          if (fieldName !== 'terms') {
            field.classList.add('border-red-500');
            field.classList.remove('border-gray-300');
          }
          this.errors[fieldName] = message;
        } else {
          errorDiv.classList.add('hidden');
          if (fieldName !== 'terms') {
            field.classList.remove('border-red-500');
            field.classList.add('border-gray-300');
          }
          delete this.errors[fieldName];
        }
      }

      clearFieldError(fieldName) {
        const errorDiv = document.getElementById(`${fieldName}Error`);
        const field = this.fields[fieldName];
        
        errorDiv.classList.add('hidden');
        if (fieldName !== 'terms') {
          field.classList.remove('border-red-500');
          field.classList.add('border-gray-300');
        }
        delete this.errors[fieldName];
      }

      validateForm() {
        // Validate all fields
        let isFormValid = true;
        Object.keys(this.fields).forEach(fieldName => {
          if (!this.validateField(fieldName)) {
            isFormValid = false;
          }
        });

        if (isFormValid) {
          this.submitForm();
        } else {
          // Focus on first error field
          const firstErrorField = Object.keys(this.errors)[0];
          if (firstErrorField && this.fields[firstErrorField]) {
            this.fields[firstErrorField].focus();
          }
          
          // Show summary error
          this.showFormError('Please correct the errors above before submitting');
        }
      }

      showFormError(message) {
        // Create or update form-level error message
        let formError = document.getElementById('formError');
        if (!formError) {
          formError = document.createElement('div');
          formError.id = 'formError';
          formError.className = 'bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-4';
          this.form.insertBefore(formError, this.form.firstChild);
        }
        
        formError.textContent = message;
        formError.classList.remove('hidden');
        
        // Auto-hide after 5 seconds
        setTimeout(() => {
          formError.classList.add('hidden');
        }, 5000);
      }

      submitForm() {
        // Hide any form errors
        const formError = document.getElementById('formError');
        if (formError) {
          formError.classList.add('hidden');
        }

        // Get form data
        const formData = new FormData(this.form);
        const userData = {
          fullName: formData.get('fullName').trim(),
          email: formData.get('email').trim().toLowerCase(),
          phone: formData.get('phone').trim(),
          password: formData.get('password'),
          terms: formData.get('terms')
        };

        // Show success message
        this.showSuccessMessage();
        console.log('User registration data:', userData);
        
        // In a real application, you would send this data to your backend
        // setTimeout(() => {
        //   window.location.href = 'login.html';
        // }, 2000);
      }

      showSuccessMessage() {
        // Create success message
        const successDiv = document.createElement('div');
        successDiv.className = 'bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg mb-4 animate-pulse';
        successDiv.innerHTML = `
          <div class="flex items-center">
            <span class="text-green-500 mr-2">✓</span>
            <span>Account created successfully! Welcome to Kooru Bookstore.</span>
          </div>
        `;
        
        this.form.insertBefore(successDiv, this.form.firstChild);
        
        // Disable form
        const inputs = this.form.querySelectorAll('input, button');
        inputs.forEach(input => input.disabled = true);
      }
    }

    // Initialize form validator
    const validator = new FormValidator();

    // Add smooth focus transitions
    const inputs = document.querySelectorAll('input[type="text"], input[type="email"], input[type="tel"], input[type="password"]');
    inputs.forEach(input => {
      input.addEventListener('focus', () => {
        input.parentElement.classList.add('scale-[1.02]');
      });
      
      input.addEventListener('blur', () => {
        input.parentElement.classList.remove('scale-[1.02]');
      });
    });

    // Real-time password strength indicator
    const passwordField = document.getElementById('password');
    const passwordContainer = passwordField.parentElement;
    
    // Create password strength indicator
    const strengthIndicator = document.createElement('div');
    strengthIndicator.id = 'passwordStrength';
    strengthIndicator.className = 'mt-2 hidden';
    strengthIndicator.innerHTML = `
      <div class="text-sm text-gray-600 mb-1">Password Strength:</div>
      <div class="flex space-x-1">
        <div class="h-2 w-1/4 bg-gray-200 rounded"></div>
        <div class="h-2 w-1/4 bg-gray-200 rounded"></div>
        <div class="h-2 w-1/4 bg-gray-200 rounded"></div>
        <div class="h-2 w-1/4 bg-gray-200 rounded"></div>
      </div>
      <div class="text-xs mt-1" id="strengthText">Enter password</div>
    `;
    passwordContainer.appendChild(strengthIndicator);

    passwordField.addEventListener('input', () => {
      const password = passwordField.value;
      if (password) {
        strengthIndicator.classList.remove('hidden');
        updatePasswordStrength(password);
      } else {
        strengthIndicator.classList.add('hidden');
      }
    });

    function updatePasswordStrength(password) {
      const strengthBars = strengthIndicator.querySelectorAll('.h-2');
      const strengthText = document.getElementById('strengthText');
      
      let strength = 0;
      let feedback = [];

      // Check criteria
      if (password.length >= 8) strength++;
      else feedback.push('8+ characters');
      
      if (/[A-Z]/.test(password)) strength++;
      else feedback.push('uppercase letter');
      
      if (/[a-z]/.test(password)) strength++;
      else feedback.push('lowercase letter');
      
      if (/\d/.test(password)) strength++;
      else feedback.push('number');
      
      if (/[!@#$%^&*(),.?":{}|<>]/.test(password)) strength++;
      else feedback.push('special character');

      // Update strength bars
      strengthBars.forEach((bar, index) => {
        bar.className = 'h-2 w-1/4 rounded';
        if (index < strength) {
          if (strength <= 2) bar.className += ' bg-red-400';
          else if (strength <= 3) bar.className += ' bg-yellow-400';
          else if (strength <= 4) bar.className += ' bg-blue-400';
          else bar.className += ' bg-green-400';
        } else {
          bar.className += ' bg-gray-200';
        }
      });

      // Update text
      if (strength <= 2) {
        strengthText.textContent = `Weak - Add: ${feedback.join(', ')}`;
        strengthText.className = 'text-xs mt-1 text-red-600';
      } else if (strength <= 3) {
        strengthText.textContent = `Fair - Add: ${feedback.join(', ')}`;
        strengthText.className = 'text-xs mt-1 text-yellow-600';
      } else if (strength <= 4) {
        strengthText.textContent = `Good - Add: ${feedback.join(', ')}`;
        strengthText.className = 'text-xs mt-1 text-blue-600';
      } else {
        strengthText.textContent = 'Strong password!';
        strengthText.className = 'text-xs mt-1 text-green-600';
      }
    }
  </script>
</body>
</html>
