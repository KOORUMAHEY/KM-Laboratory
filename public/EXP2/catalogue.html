<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kooru Bookstore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>

<body class="bg-gray-100">
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-2">
        <span class="text-3xl">📚</span>
        <span class="text-2xl font-bold text-purple-700">Kooru Bookstore</span>
      </a>
      <nav class="hidden md:flex space-x-6">
        <a href="index.html" class="hover:text-purple-700">Home</a>
        <a href="catalogue.html" class="hover:text-purple-700">Catalogue</a>
        <a href="cart.html" class="relative hover:text-purple-700">
          Cart
          <span class="absolute -top-2 -right-4 bg-purple-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </a>
        <a href="login.html" class="hover:text-purple-700">Login</a>
        <a href="registration.html" class="bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">Register</a>
      </nav>
      <button id="mobile-menu-button" class="md:hidden text-gray-600 hover:text-purple-700">
        ☰
      </button>
    </div>
    <div id="mobile-menu" class="md:hidden hidden px-4 pb-4 space-y-2">
      <a href="index.html" class="block hover:text-purple-700">Home</a>
      <a href="catalogue.html" class="block hover:text-purple-700">Catalogue</a>
      <a href="cart.html" class="block hover:text-purple-700">Cart</a>
      <a href="login.html" class="block hover:text-purple-700">Login</a>
      <a href="registration.html" class="block bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">Register</a>
    </div>
  </header>
  <main class="max-w-5xl mx-auto py-12 px-6">
  <h2 class="text-3xl font-bold text-purple-700 mb-8">Book Catalogue</h2>
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
    <a href="cse.html" data-link class="bg-white p-6 rounded-lg shadow hover:shadow-xl transition">
      <h3 class="font-semibold text-xl text-gray-800">💻 CSE</h3>
      <p class="text-gray-600 mt-2">Explore Computer Science books</p>
    </a>
    <a href="ece.html" data-link class="bg-white p-6 rounded-lg shadow hover:shadow-xl transition">
      <h3 class="font-semibold text-xl text-gray-800">📡 ECE</h3>
      <p class="text-gray-600 mt-2">Explore Electronics books</p>
    </a>
    <a href="eee.html" data-link class="bg-white p-6 rounded-lg shadow hover:shadow-xl transition">
      <h3 class="font-semibold text-xl text-gray-800">⚡ EEE</h3>
      <p class="text-gray-600 mt-2">Explore Electrical books</p>
    </a>
    <a href="civil.html" data-link class="bg-white p-6 rounded-lg shadow hover:shadow-xl transition">
      <h3 class="font-semibold text-xl text-gray-800">🏗️ Civil</h3>
      <p class="text-gray-600 mt-2">Explore Civil Engineering books</p>
    </a>
  </div>
</main>
</body>
</html>
