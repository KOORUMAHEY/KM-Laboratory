<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kooru Bookstore</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gray-100">
  <header class="bg-white shadow sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-2">
        <span class="text-3xl">📚</span>
        <span class="text-2xl font-bold text-purple-700">Kooru Bookstore</span>
      </a>
      <nav class="hidden md:flex space-x-6">
        <a href="index.html" class="hover:text-purple-700">Home</a>
        <a href="catalogue.html" class="hover:text-purple-700">Catalogue</a>
        <a href="cart.html" class="relative hover:text-purple-700">
          Cart
          <span
            class="absolute -top-2 -right-4 bg-purple-600 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center">0</span>
        </a>
        <a href="login.html" class="hover:text-purple-700">Login</a>
        <a href="registration.html" class="bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">Register</a>
      </nav>
      <button id="mobile-menu-button" class="md:hidden text-gray-600 hover:text-purple-700">
        ☰
      </button>
    </div>
    <div id="mobile-menu" class="md:hidden hidden px-4 pb-4 space-y-2">
      <a href="index.html" class="block hover:text-purple-700">Home</a>
      <a href="catalogue.html" class="block hover:text-purple-700">Catalogue</a>
      <a href="cart.html" class="block hover:text-purple-700">Cart</a>
      <a href="login.html" class="block hover:text-purple-700">Login</a>
      <a href="registration.html"
        class="block bg-purple-700 text-white px-4 py-2 rounded hover:bg-purple-800">Register</a>
    </div>
  </header>
<main>
  <!-- Department Banner -->
  <div class="bg-gradient-to-r from-purple-700 to-indigo-600 text-white rounded-lg shadow-xl p-8 md:p-12 mb-12">
    <h2 class="text-4xl md:text-5xl font-bold mb-3">Computer Science & Engineering</h2>
    <p class="text-lg text-purple-200 max-w-2xl">From operating systems to artificial intelligence, find all the essential textbooks for your CSE curriculum right here.</p>
  </div>

  <!-- Main Content Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
    
    <!-- Left Sidebar: Filters & Sorting -->
    <aside class="lg:col-span-1">
      <div class="bg-white p-6 rounded-lg shadow-md sticky top-28">
        <h3 class="text-xl font-bold text-gray-800 mb-4">Filter Options</h3>
        
        <!-- Search -->
        <div>
          <label for="search" class="block text-sm font-medium text-gray-700">Search by Title</label>
          <input type="text" id="search" placeholder="e.g., 'Networks'" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
        </div>
        
        <!-- Sorting -->
        <div class="mt-6">
          <label for="sort" class="block text-sm font-medium text-gray-700">Sort By</label>
          <select id="sort" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm">
            <option>Default</option>
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
            <option>Alphabetical</option>
          </select>
        </div>
        <button class="mt-6 w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700 transition">Apply Filters</button>
      </div>
    </aside>

    <!-- Right Content: Book List -->
    <div class="lg:col-span-3">
      <h3 class="text-2xl font-bold text-gray-800 mb-6">All CSE Books</h3>
      <!-- This is the container your main JS will fill with book cards -->
      <div id="book-list" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
        <!-- Books will be dynamically inserted here by the main script -->
      </div>
    </div>
  </div>
</main>

 <script>
    fetch('books.json')
      .then(response => response.json())
      .then(data => {
        const cseBooks = data.filter(book => book.department === "CSE");
        const bookList = document.getElementById("book-list");

        cseBooks.forEach(book => {
          const card = document.createElement("div");
          card.className = "bg-white p-6 rounded-lg shadow-md hover:shadow-lg transition";

          card.innerHTML = `
          <div class="flex justify-between items-start gap-4">
            <div class="flex-1">
              <h3 class="font-semibold text-xl text-gray-800 mb-1">${book.title}</h3>
              <p class="text-gray-600 mb-1">${book.author}</p>
              <p class="text-purple-700 font-bold">₹${book.price}</p>
            </div>
            <div class="w-20 h-28 flex-shrink-0">
              <img src="${book.image}" alt="${book.title} Cover" class="w-full h-full object-cover rounded" />
            </div>
          </div>
          <div class="mt-4 flex space-x-2">
            <button class="add-to-cart flex-1 bg-purple-700 text-white px-4 py-2 rounded-lg hover:bg-purple-800 transition">Add to Cart</button>
            <button class="show-details px-4 py-2 border border-purple-700 text-purple-700 rounded-lg hover:bg-purple-50 transition">Details</button>
          </div>
        `;

          bookList.appendChild(card);
        });
      });
  </script>

 

</body>

</html>
